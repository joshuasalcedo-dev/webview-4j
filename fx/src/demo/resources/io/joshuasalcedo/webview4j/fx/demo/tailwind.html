<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tailwind + JavaScript in JavaFX</title>
  <!-- Tailwind CSS 4, compiled in the page: every utility class works, no build step. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-900 antialiased transition-colors dark:bg-zinc-950 dark:text-zinc-100">
  <div class="mx-auto max-w-5xl p-6 space-y-6">

    <header class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <p class="text-sm font-medium text-indigo-600 dark:text-indigo-400">webview-4j-fx</p>
        <h1 class="text-3xl font-bold tracking-tight">Tailwind and JavaScript, inside JavaFX</h1>
        <p class="mt-1 text-zinc-500 dark:text-zinc-400" id="engine">…</p>
      </div>
      <button id="theme" class="rounded-full border border-zinc-300 px-4 py-2 text-sm font-medium shadow-sm transition hover:bg-zinc-100 active:scale-95 dark:border-zinc-700 dark:hover:bg-zinc-800">
        Dark mode
      </button>
    </header>

    <section class="grid gap-4 sm:grid-cols-3">
      <div class="rounded-2xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 p-5 text-white shadow-lg">
        <p class="text-sm/6 opacity-80">Counter</p>
        <p class="text-5xl font-black tabular-nums" id="count">0</p>
        <div class="mt-3 flex gap-2">
          <button data-step="-1" class="step rounded-lg bg-white/20 px-3 py-1 font-semibold hover:bg-white/30">−</button>
          <button data-step="1" class="step rounded-lg bg-white/20 px-3 py-1 font-semibold hover:bg-white/30">+</button>
        </div>
      </div>
      <div class="rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
        <p class="text-sm text-zinc-500">Clock</p>
        <p class="text-3xl font-semibold tabular-nums" id="clock">--:--:--</p>
        <div class="mt-4 h-2 overflow-hidden rounded-full bg-zinc-200 dark:bg-zinc-800">
          <div id="seconds" class="h-full rounded-full bg-emerald-500 transition-all duration-300" style="width:0%"></div>
        </div>
      </div>
      <div class="rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
        <p class="text-sm text-zinc-500">Network</p>
        <button id="load" class="mt-2 w-full rounded-lg bg-zinc-900 px-3 py-2 text-sm font-semibold text-white hover:bg-zinc-700 dark:bg-white dark:text-zinc-900 dark:hover:bg-zinc-200">
          Load users (fetch)
        </button>
        <p class="mt-2 text-xs text-zinc-500">Watch it in the Network tab below.</p>
      </div>
    </section>

    <section class="grid gap-6 lg:grid-cols-2">
      <div class="rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
        <h2 class="text-lg font-semibold">To do</h2>
        <form id="todo-form" class="mt-3 flex gap-2">
          <input id="todo-input" placeholder="Something to do"
                 class="flex-1 rounded-lg border border-zinc-300 bg-transparent px-3 py-2 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 dark:border-zinc-700">
          <button class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-500">Add</button>
        </form>
        <ul id="todos" class="mt-4 space-y-2"></ul>
        <p id="todo-count" class="mt-3 text-sm text-zinc-500"></p>
      </div>

      <div class="rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
        <h2 class="text-lg font-semibold">Users</h2>
        <ul id="users" class="mt-3 divide-y divide-zinc-100 dark:divide-zinc-800">
          <li class="py-6 text-center text-sm text-zinc-500">Press “Load users”, here or in JavaFX.</li>
        </ul>
      </div>
    </section>
  </div>

  <div id="toasts" class="pointer-events-none fixed bottom-4 right-4 flex flex-col items-end gap-2"></div>

  <script>
    // Everything JavaFX can call: web.eval("demo.addTodo('Milk')") and so on.
    const demo = window.demo = {
      count: 0,
      todos: [
        { text: 'Open a page in JavaFX', done: true },
        { text: 'Style it with Tailwind', done: true },
        { text: 'Change it from Java', done: false },
      ],

      step(by) {
        demo.count += by;
        document.getElementById('count').textContent = demo.count;
        return demo.count;
      },

      setDark(on) {
        document.documentElement.classList.toggle('dark', on);
        document.getElementById('theme').textContent = on ? 'Light mode' : 'Dark mode';
        console.log('dark mode', on);
        return on;
      },

      addTodo(text) {
        if (!text || !text.trim()) return demo.todos.length;
        demo.todos.push({ text: text.trim(), done: false });
        demo.renderTodos();
        console.log('added a to-do:', text);
        return demo.todos.length;
      },

      toggleTodo(index) {
        demo.todos[index].done = !demo.todos[index].done;
        demo.renderTodos();
      },

      removeTodo(index) {
        demo.todos.splice(index, 1);
        demo.renderTodos();
      },

      renderTodos() {
        const list = document.getElementById('todos');
        list.replaceChildren(...demo.todos.map((todo, i) => {
          const li = document.createElement('li');
          li.className = 'group flex items-center gap-3 rounded-lg border border-zinc-200 px-3 py-2 dark:border-zinc-800';
          li.innerHTML = `
            <input type="checkbox" class="size-4 accent-indigo-600" ${todo.done ? 'checked' : ''}>
            <span class="flex-1 ${todo.done ? 'text-zinc-400 line-through' : ''}"></span>
            <button class="text-sm text-zinc-400 opacity-0 transition group-hover:opacity-100 hover:text-rose-500">Remove</button>`;
          li.querySelector('span').textContent = todo.text;
          li.querySelector('input').addEventListener('change', () => demo.toggleTodo(i));
          li.querySelector('button').addEventListener('click', () => demo.removeTodo(i));
          return li;
        }));
        const left = demo.todos.filter(t => !t.done).length;
        document.getElementById('todo-count').textContent = `${left} left of ${demo.todos.length}`;
      },

      async loadUsers() {
        const list = document.getElementById('users');
        list.innerHTML = '<li class="py-6 text-center text-sm text-zinc-500 animate-pulse">Loading…</li>';
        try {
          const response = await fetch('https://jsonplaceholder.typicode.com/users');
          const users = await response.json();
          list.replaceChildren(...users.slice(0, 6).map(user => {
            const li = document.createElement('li');
            li.className = 'flex items-center gap-3 py-2';
            const initials = user.name.split(' ').map(w => w[0]).slice(0, 2).join('');
            li.innerHTML = `<span class="grid size-9 place-items-center rounded-full bg-indigo-100 text-sm font-bold text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300"></span>
              <div><p class="font-medium"></p><p class="text-sm text-zinc-500"></p></div>`;
            li.querySelector('span').textContent = initials;
            li.querySelector('p').textContent = user.name;
            li.querySelectorAll('p')[1].textContent = user.email;
            return li;
          }));
          demo.toast(`Loaded ${users.length} users`);
          return users.length;
        } catch (error) {
          list.innerHTML = '<li class="py-6 text-center text-sm text-rose-500">Could not load them: offline?</li>';
          console.error('loading users failed', error);
          return 0;
        }
      },

      toast(message) {
        const toast = document.createElement('div');
        toast.className = 'pointer-events-auto rounded-xl bg-zinc-900 px-4 py-3 text-sm font-medium text-white shadow-xl ring-1 ring-white/10 transition duration-300 translate-y-2 opacity-0 dark:bg-white dark:text-zinc-900';
        toast.textContent = message;
        document.getElementById('toasts').append(toast);
        requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
        setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 2500);
        return message;
      },

      state() {
        return { count: demo.count, dark: document.documentElement.classList.contains('dark'), todos: demo.todos };
      },
    };

    document.querySelectorAll('.step').forEach(b => b.addEventListener('click', () => demo.step(Number(b.dataset.step))));
    document.getElementById('theme').addEventListener('click', () => demo.setDark(!document.documentElement.classList.contains('dark')));
    document.getElementById('load').addEventListener('click', () => demo.loadUsers());
    document.getElementById('todo-form').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.getElementById('todo-input');
      demo.addTodo(input.value);
      input.value = '';
    });
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString();
      document.getElementById('seconds').style.width = (now.getSeconds() / 59 * 100) + '%';
    }, 250);
    const agent = navigator.userAgent.match(/Edg\/(\d+)/);
    document.getElementById('engine').textContent = agent
      ? `Microsoft Edge ${agent[1]} (WebView2, Chromium): the same engine as the browser.`
      : navigator.userAgent;
    demo.renderTodos();
    // Follows the app's theme (JavaFX's Theme choice sets prefers-color-scheme), until the button picks one.
    const scheme = matchMedia('(prefers-color-scheme: dark)');
    demo.setDark(scheme.matches);
    scheme.addEventListener('change', e => demo.setDark(e.matches));
    console.log('page ready: try demo.state() in the console below');
  </script>
</body>
</html>
