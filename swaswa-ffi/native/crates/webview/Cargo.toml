[package]
name = "webview"
version.workspace = true
edition.workspace = true

# webview4j.dll / libwebview4j.so / libwebview4j.dylib: loaded by the Java library through FFM.
[lib]
name = "webview4j"
crate-type = ["cdylib", "rlib"]

[dependencies]
inspector = { path = "../inspector" }
# Spelling and grammar for Java (grammar.rs): Harper.
grammar = { path = "../grammar" }
tao = "0.36.0"
# devtools: open_devtools() in release builds too (View.openDevTools). On macOS it uses a private API (App Store review).
wry = { version = "0.56.0", features = ["devtools"] }
serde = { workspace = true }
serde_json = "1"
log = "0.4"
# A window's icon: the PNG Java sends, in base64, as RGBA pixels.
base64 = "0.22"
png = "0.17"
# Recordings of the app's windows as animated GIFs (capture.rs).
gif = "0.13"
# Secrets in the system's vault (secret.rs): Credential Manager, the Keychain, the Secret Service.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
# The app's own sounds (app.play).
rodio = { version = "0.20.1", default-features = false, features = ["mp3", "wav", "vorbis", "flac"] }
# Native file dialogs and message boxes (app.dialog.*). On Linux through the XDG desktop portal.
rfd = "0.18"
# Waits for a dialog's answer on a thread of its own.
pollster = "1"
# The app's local store (store.rs): Java's persisted state, keys and bytes in one ACID file.
redb = "5"

[dev-dependencies]

# Windows: resizing a frameless window from the page's edge (runtime.rs, start_resize).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    # Pictures of the app's own windows (capture.rs): PrintWindow, a DIB, the window's visible bounds.
    "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps",
    # An opt-in crash recorder (crashdump.rs): a minidump of a crash in a DLL, as it happens.
    "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Threading",
    "Win32_System_Kernel", "Win32_System_Memory",
    # Whether the process runs as administrator (oserror.rs).
    "Win32_Security",
    # How much memory each process uses (memory.rs).
    "Win32_System_ProcessStatus",
    # Child processes that end with the app (jobs.rs).
    "Win32_System_JobObjects",
    # When a window is moved or sized by a person (pointer.rs): a subclass of its window.
    "Win32_UI_Shell"] }
# MP4 recordings with Windows' own H.264 encoder, Media Foundation (mediafoundation.rs): no ffmpeg needed.
# The page's DevTools Protocol (cdp.rs): the same WebView2 bindings wry uses.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation",
    # Files dragged out of the app (dragout.rs): the Shell's data object, OLE's drag.
    "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.61"

[target.'cfg(unix)'.dependencies]
# Whether the process runs as root (oserror.rs).
libc = "0.2"
