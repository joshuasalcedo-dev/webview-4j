# Publishes every module to Maven Central when a tag vX.Y.Z is pushed (or by hand, with a version).
# The native library is built on each OS, then one jar carries all of them (core's -PprebuiltNatives).
# Secrets (this repository): MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD (a Central Portal user token),
# SIGNING_KEY (an ASCII-armoured private PGP key) and SIGNING_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.0'
        required: true

jobs:
  natives:
    strategy:
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64 }
          - { os: ubuntu-latest,  platform: linux-x64 }
          - { os: macos-13,       platform: macos-x64 }
          - { os: macos-latest,   platform: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries (WebKitGTK, GTK, ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:natives --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: core/build/generated/natives

  publish:
    needs: natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          merge-multiple: true
          path: all-natives
      - name: Every platform is there
        run: |
          for p in windows-x64 linux-x64 macos-x64 macos-aarch64; do
            ls all-natives/natives/$p/* || { echo "the native library for $p is missing"; exit 1; }
          done
      - name: Publish to Maven Central
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew publishToMavenCentral --console=plain --no-configuration-cache \
            -PreleaseVersion="$VERSION" -PprebuiltNatives="$PWD/all-natives"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
