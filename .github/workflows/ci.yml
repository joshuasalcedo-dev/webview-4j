# Builds and tests every module on each OS, for a release (release.yml publishes it, on the same tag vX.Y.Z).
name: CI

# Only for a release: a version tag (v0.2.0), or started by hand (Actions > CI > Run workflow). Pushes to main
# while developing do not run it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      # egui-4j's components for the page (core's uiEgui): the wasm target, and wasm-bindgen at Cargo.lock's version
      - name: wasm-bindgen's version
        shell: bash
        run: echo "WASM_BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-bindgen@${{ env.WASM_BINDGEN }}" }
      - name: Linux libraries (WebKitGTK, GTK, ALSA, D-Bus for the Secret Service)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libdbus-1-dev pkg-config xvfb
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      # core's jar carries @webview4j/ui, built with bun
      - uses: oven-sh/setup-bun@v2
      # The tests open real (headless) windows: on Linux GTK still needs a display, so a virtual one.
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}./gradlew build --console=plain
        shell: bash
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests'

  # Discord #deployments only when main breaks (pull requests and green builds stay quiet).
  notify:
    needs: build
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOYMENTS }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK_DEPLOYMENTS is not set: skipping"; exit 0; fi
          python3 - <<'PY' > payload.json
          import json, os
          e = os.environ
          print(json.dumps({"embeds": [{"title": "🔴 webview-4j CI FAILED", "url": e["RUN_URL"], "color": 15158332,
                                        "description": f"**{e['REPO']}** @ `{e['SHA'][:7]}` by {e['ACTOR']}"}]}))
          PY
          curl -fsS -H "Content-Type: application/json" --data @payload.json "$WEBHOOK" >/dev/null && echo "posted to Discord"
