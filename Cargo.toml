[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

# egui-4j for the page (core/src/main/ui: bun run egui): as small as it goes, it is downloaded by every page that shows one
[profile.wasm]
inherits = "release"
opt-level = "z"
