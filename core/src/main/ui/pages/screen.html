<!doctype html>
<!-- A window made in Java (UiWindow): the kit renders the tree Java sends. Built into core's jar beside ui.js. -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./ui.css">
  <style>html, body, #root { height: 100%; margin: 0; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { mountJavaUi } from "./ui.js";
    mountJavaUi(document.getElementById("root"));
  </script>
</body>
</html>
