[package]
name = "webview"
version.workspace = true
edition.workspace = true

# webview4j.dll / libwebview4j.so / libwebview4j.dylib: loaded by the Java library through FFM.
[lib]
name = "webview4j"
crate-type = ["cdylib", "rlib"]

[dependencies]
inspector = { path = "../inspector" }
tao = "0.36.0"
wry = "0.56.0"
serde = { workspace = true }
serde_json = "1"
