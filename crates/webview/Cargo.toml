[package]
name = "webview"
version.workspace = true
edition.workspace = true

# webview4j.dll / libwebview4j.so / libwebview4j.dylib: loaded by the Java library through FFM.
[lib]
name = "webview4j"
crate-type = ["cdylib", "rlib"]

[dependencies]
inspector = { path = "../inspector" }
tao = "0.36.0"
wry = "0.56.0"
serde = { workspace = true }
serde_json = "1"
log = "0.4"
# A window's icon: the PNG Java sends, in base64, as RGBA pixels.
base64 = "0.22"
png = "0.17"
# The app's own sounds (app.play).
rodio = { version = "0.20.1", default-features = false, features = ["mp3", "wav", "vorbis", "flac"] }
# Native file dialogs and message boxes (app.dialog.*). On Linux through the XDG desktop portal.
rfd = "0.18"
# Waits for a dialog's answer on a thread of its own.
pollster = "1"
# The app's local store (store.rs): Java's persisted state, keys and bytes in one ACID file.
redb = "5"

[dev-dependencies]

# Windows: resizing a frameless window from the page's edge (runtime.rs, start_resize).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
