[package]
name = "webview"
version.workspace = true
edition.workspace = true

# webview4j.dll / libwebview4j.so / libwebview4j.dylib: loaded by the Java library through FFM.
[lib]
name = "webview4j"
crate-type = ["cdylib", "rlib"]

[dependencies]
inspector = { path = "../inspector" }
tao = "0.36.0"
wry = "0.56.0"
serde = { workspace = true }
serde_json = "1"
log = "0.4"
# A window's icon: the PNG Java sends, in base64, as RGBA pixels.
base64 = "0.22"
png = "0.17"
# The app's own sounds (app.play).
rodio = { version = "0.20.1", default-features = false, features = ["mp3", "wav", "vorbis", "flac"] }

[dev-dependencies]
