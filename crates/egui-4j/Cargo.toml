[package]
name = "egui-4j"
version.workspace = true
edition.workspace = true
description = "egui for webview-4j: components drawn by egui (charts, editors...), run natively for development and as wasm in the page."

[lib]
name = "egui4j"
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = "0.37"
egui_plot = "0.38"
# dev-logger: its table, long lists drawn row by row as they scroll into view
egui_extras = { version = "0.37", default-features = false }
# monitor: its panes (list, stats, groups, charts, details) dock inside it as tabs, like an IDE
egui_dock = { version = "0.22", features = ["serde"] }
serde = { workspace = true }
serde_json = "1"
# what the components do (refused props, events...): to the console in the page, so Java gets it as a LogRecord
log = "0.4"
# a message's arrival time, also in the page (std's clock is not there in wasm)
web-time = "1"
# live-csv: egui-spreadsheet's viewer (only it: the spreadsheet's engine is left out of the wasm by the linker)
egui-spreadsheet = { path = "../egui-spreadsheet" }

# the page's side: the component on a <canvas> (src/web.rs), built with `bun run egui` in core/src/main/ui
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[dev-dependencies]
# a native window for each component (cargo run --example <component>) and headless tests
# glow (OpenGL) as well: the dev-logger example's see-through window (wgpu does not blend it with the desktop on Windows)
eframe = { version = "0.37", features = ["glow"] }
egui_kittest = "0.37"
# the examples' log on stderr: RUST_LOG=egui4j=debug cargo run -p egui-4j --example line_chart
env_logger = "0.11"
raw-window-handle = "0.6"

# the dev-logger example docks to a screen edge: the screen's work area (without the taskbar), from Windows
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
