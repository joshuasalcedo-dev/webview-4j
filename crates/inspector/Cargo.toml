[package]
name = "inspector"
edition.workspace = true
version.workspace = true
description = "Tauri webview API listener: inject JS to intercept fetch/xhr/websocket/clicks, then log and publish captured traffic to NATS for schema discovery."

[dependencies]
serde = { workspace = true }
serde_json = "1"
thiserror = "2"
async-nats = "0.49"
log = "0.4"
